schema_version: '2.0'
directory_name: dawn-models
description: >
  Dawn Models is the model repository for the Dawn Field Institute,
  implementing post-symbolic AI architectures using Dawn Field Theory principles.
  Primary model: GAIA v2 — a modular intelligence architecture where specialized
  modules (language, reasoning, safety, memory) compose via a PAC conservation bus
  built on Fracton SDK 2.1. Also includes TinyCIMM domain-specialized variants
  (ancestors of GAIA v2 modules), SCBF interpretability framework, and CIMM Legacy
  (Apache-2.0 production engine). Dual-licensing: research (AGPL-3.0), stable (Apache-2.0).
