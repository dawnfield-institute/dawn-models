[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia"
version = "2.0.0.dev0"
description = "Modular intelligence architecture with PAC conservation bus"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
